<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

  <!-- SIGN-UP -->
  <div class="container" id="signupContainer">
    <h1>Community Hub Sign-Up</h1>
    <form id="registrationForm">
      <div class="form-group">
        <label for="username">Username <span class="required">*</span></label>
        <input type="text" id="username" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" placeholder="••••••••" required>
        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required>
        <i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
      </div>
      <button type="submit">Create Account</button>
    </form>
    <div class="login-link" id="switchLoginLink">Already have an account? Login</div>
    <button id="discordLoginSignup" class="discord-btn">
      <i class="fab fa-discord"></i> Sign in with Discord
    </button>
    <div id="message"></div>
  </div>

  <!-- LOGIN -->
  <div class="container" id="loginContainer">
    <h1>Community Hub Login</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email <span class="required">*</span></label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password <span class="required">*</span></label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
        <i class="fas fa-eye toggle-password" id="toggleLoginPassword"></i>
      </div>
      <button type="submit">Login</button>
    </form>
    <div class="login-link" id="switchSignupLink">Don't have an account? Sign up</div>
    <button id="discordLoginLogin" class="discord-btn">
      <i class="fab fa-discord"></i> Sign in with Discord
    </button>
    <div id="loginMessage"></div>
  </div>

  <!-- HOME -->
  <div class="container" id="homeContainer">
    <div class="home-top-bar">
      <div class="app-title">Community Hub</div>
      <img id="profilePic" src="https://via.placeholder.com/100" alt="Avatar">
    </div>

    <div class="home-greeting">
      <h1 id="homeUsername">Good afternoon, Artwell 👋</h1>
      <p>Here's what's happening today</p>
    </div>

    <div id="homeServers" class="home-cards"></div>

    <div class="home-nav">
      <div class="home-nav-item active">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </div>
      <div class="home-nav-item">
        <i class="fas fa-list"></i>
        <span>Tasks</span>
      </div>
      <div class="home-nav-item">
        <i class="fas fa-users"></i>
        <span>Teams</span>
      </div>
      <div class="home-nav-item">
        <i class="fas fa-cog"></i>
        <span>Settings</span>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
